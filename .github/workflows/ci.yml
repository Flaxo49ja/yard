name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Tests (duration parser, ledger math, roundtrip, date math)
        run: cargo test
      - name: Clippy (warnings are failures — same bar as the Python projects)
        run: cargo clippy -- -D warnings
