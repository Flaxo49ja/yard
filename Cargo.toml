[package]
name = "yard"
version = "0.3.0"
edition = "2021"
description = "A cozy, slightly strict study CLI: focus to earn yard time."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# restores the terminal (cursor back) when the session dies via Ctrl+C
ctrlc = "3"
# directories = "5"       # arrives with lockdown/data-path polish (v0.2+)
# notify-rust = "4"       # arrives with the desktop widget (v0.7+)
